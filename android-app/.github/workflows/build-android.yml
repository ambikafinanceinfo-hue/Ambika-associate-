name: Build Play Store AAB & Direct APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android project directory
        id: detect
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "android-app/settings.gradle.kts" ]; then
            echo "dir=android-app" >> $GITHUB_OUTPUT
          else
            echo "Could not find settings.gradle.kts in repository root or android-app/"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Play Store Keystore (if configured in GitHub Secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ steps.detect.outputs.dir }}/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/${{ steps.detect.outputs.dir }}/upload-keystore.jks" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Direct Installable APK & Play Store AAB
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload APK & Play Store AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ambika-associate-crm-android-builds
          path: |
            ${{ steps.detect.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.detect.outputs.dir }}/app/build/outputs/apk/release/*.apk
            ${{ steps.detect.outputs.dir }}/app/build/outputs/bundle/release/*.aab
