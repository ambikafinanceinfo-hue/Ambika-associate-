<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2744"/>
      <stop offset="100%" stop-color="#09182C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Executive Navy Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle Outer Shield Ring -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#15803D" stroke-width="6" opacity="0.65"/>

  <!-- Top Gold Crown Accent -->
  <circle cx="256" cy="186" r="118" fill="#15803D" opacity="0.16"/>
  <circle cx="256" cy="186" r="118" fill="none" stroke="#15803D" stroke-width="8"/>

  <!-- Rising Growth Bars inside Emblem -->
  <rect x="190" y="218" width="18" height="42" rx="4" fill="#EA580C"/>
  <rect x="216" y="198" width="18" height="62" rx="4" fill="#16A34A"/>

  <!-- Interlocked AA Monogram -->
  <path d="M266 96L176 268h36l17-36h74l17 36h36L266 96zm-21 106l21-46 21 46h-42z" fill="url(#goldGrad)"/>
  <path d="M312 146l56 122h-30l-12-28h-34l10-22h15l-15-34z" fill="#FFFFFF" opacity="0.92"/>

  <!-- Brand Wordmark -->
  <text x="256" y="366" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Liberation Sans, sans-serif" font-weight="800" font-size="52" letter-spacing="3" fill="#FFFFFF">AMBIKA</text>
  <text x="256" y="408" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Liberation Sans, sans-serif" font-weight="700" font-size="30" letter-spacing="5" fill="#FACC15">ASSOCIATE</text>

  <!-- Orange & Green Growth Accent Bar -->
  <rect x="116" y="428" width="176" height="10" rx="5" fill="#EA580C"/>
  <rect x="298" y="428" width="98" height="10" rx="5" fill="#16A34A"/>

  <!-- Tagline -->
  <text x="256" y="462" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Liberation Sans, sans-serif" font-weight="700" font-size="15" letter-spacing="2.5" fill="#CBD5E1">SMART FINANCE · SMART SAVING</text>
</svg>
